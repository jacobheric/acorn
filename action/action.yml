name: Acorn CI
description: Verify a signed CI receipt or request a disposable Railway runner.
inputs:
  url:
    description: Acorn coordinator URL
    required: true
  commit:
    description: Exact commit SHA to check
    required: true
  mode:
    description: verify, fallback, or firewall
    default: fallback
  pull-request:
    description: PR number for supersession and testing the proposed merge result
  merge-gate:
    description: Whether firewall mode requires fresh CI; false reports a skipped gate
    default: "true"
  wait-for-merge:
    description: In firewall mode, wait until auto-merge is enabled on the PR
    default: "false"
  token:
    description: Scoped Acorn automation token; required for fallback and firewall
  github-token:
    description: GitHub token with checks write access
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACORN_URL: ${{ inputs.url }}
        ACORN_COMMIT: ${{ inputs.commit }}
        ACORN_MODE: ${{ inputs.mode }}
        ACORN_PULL_REQUEST: ${{ inputs.pull-request }}
        ACORN_MERGE_GATE: ${{ inputs.merge-gate }}
        ACORN_WAIT_FOR_MERGE: ${{ inputs.wait-for-merge }}
        ACORN_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"
